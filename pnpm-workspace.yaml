packages:
  - apps/*
  - packages/*

allowBuilds:
  '@scarf/scarf': false
  '@prisma/engines': true
  cpu-features: false
  esbuild: true
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
